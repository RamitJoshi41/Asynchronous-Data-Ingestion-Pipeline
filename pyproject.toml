[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingest"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime deps are added in the phase that first imports them (ADR-0004).
dependencies = [
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

# A dependency group (not an optional extra) so plain `uv sync` installs the dev tools.
[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "mypy==2.3.1",
    "ruff==0.16.9",
    "respx>=0.23.1",
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "asyncpg-stubs>=0.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so tests can import the top-level `benchmarks` tooling package (ADR-0012).
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "benchmarks"]
mypy_path = "src"
# Teaches mypy pydantic's real __init__ signatures, e.g. BaseSettings(_env_file=...).
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
