# One-command run (Phase 6): `docker compose up --build` → Postgres, migrations once, API on :8000.
# CLI runs: `docker compose run --rm app run all`. Tests use only the `db` service.
# Explainer: docs/explain/compose.md
x-app: &app
  build: .
  image: pipeline:local
  environment:
    # Inside the compose network the database is `db:5432` (5433 is only the host-side port).
    DB_DSN: postgresql://ingest:ingest@db:5432/ingest
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}  # optional; read from your shell, never committed
    LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest  # local-dev only; never reuse outside this container
      POSTGRES_DB: ingest
    ports:
      # 5433 on the host because a system PostgreSQL 14 already owns 5432 on RJ's machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
