# Phase 1: only the database. The app service arrives in Phase 6 (one-command run).
# Explainer: docs/explain/compose.md
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest  # local-dev only; never reuse outside this container
      POSTGRES_DB: ingest
    ports:
      # 5433 on the host because a system PostgreSQL 14 already owns 5432 on RJ's machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
